<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  tekkiech-rice — user fontconfig override, installed to
  ~/.config/fontconfig/fonts.conf

  Forces grayscale antialiasing instead of the freetype/cairo default
  of subpixel (RGB) antialiasing. Subpixel AA looks fine on a real
  physical LCD, but produces visible RGB color fringing on text the
  moment it's captured as a plain screenshot or viewed through
  anything that isn't the exact physical subpixel layout it assumes —
  found live: every bit of bar/rofi/dunst text had a faint but real
  orange/blue fringe around each character in every grim screenshot.
  Grayscale AA looks identical either way, so this is the safer
  default for a rice whose look gets judged through screenshots.
-->
<fontconfig>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
