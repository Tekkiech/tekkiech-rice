<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg-0: oklch(0.13 0.004 258);
      --surface: oklch(0.24 0.006 258 / 0.72);
      --border: oklch(1 0 0 / 0.09);
      --border-strong: oklch(1 0 0 / 0.18);
      --text: oklch(0.97 0.002 258);
      --text-dim: oklch(0.7 0.005 258);
      --text-faint: oklch(0.48 0.005 258);
      --white: oklch(0.98 0 0);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
    a{color:var(--text);} a:hover{color:var(--text-dim);}
  </style>
</helmet>
<div style="width:1600px;height:1000px;position:relative;overflow:hidden;background:var(--bg-0);color:var(--text);">

  <div style="position:absolute;inset:0;background:oklch(0 0 0);"></div>

  <div style="position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--surface);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);border-bottom:1px solid var(--border);z-index:2;">

    <div style="display:flex;align-items:center;gap:14px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="width:20px;height:20px;border-radius:5px;background:var(--white);color:oklch(0.15 0 0);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;" class="mono">1</div>
        <div style="width:20px;height:20px;border-radius:5px;border:1px solid var(--border-strong);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:11px;" class="mono">2</div>
        <div style="width:20px;height:20px;border-radius:5px;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11px;" class="mono">3</div>
        <div style="width:20px;height:20px;border-radius:5px;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11px;" class="mono">4</div>
        <div style="width:20px;height:20px;border-radius:5px;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11px;" class="mono">5</div>
      </div>
      <div style="width:1px;height:16px;background:var(--border-strong);"></div>
      <div class="mono" style="font-size:13px;color:var(--text-dim);">~/dotfiles &mdash; nvim</div>
    </div>

    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:baseline;gap:10px;">
      <span class="mono" style="font-size:15px;font-weight:600;color:var(--text);letter-spacing:0.02em;">14:32</span>
      <span class="mono" style="font-size:12px;color:var(--text-faint);">Sat, Aug 30</span>
    </div>

    <div style="display:flex;align-items:center;gap:16px;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint);">
        <path d="M9 9v3a3 3 0 0 0 4.6 2.5"/>
        <path d="M15 9V6a3 3 0 0 0-5.9-.7"/>
        <path d="M19 11a7 7 0 0 1-1.3 4.1"/>
        <path d="M5 11a7 7 0 0 0 9.9 6.4"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="3" y1="3" x2="21" y2="21"/>
      </svg>

      <div style="display:flex;align-items:center;gap:6px;color:var(--text-dim);">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5a16 16 0 0 1 18 0"/>
          <path d="M6.2 12.2a11 11 0 0 1 11.6 0"/>
          <path d="M9.5 15.8a6 6 0 0 1 5 0"/>
          <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="mono" style="font-size:12px;">Home</span>
      </div>

      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint);">
        <path d="M7 7l10 10-5 5V2l5 5L7 17"/>
      </svg>

      <div style="display:flex;align-items:center;gap:6px;color:var(--text-dim);">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="2" y="7" width="18" height="10" rx="2.5"/>
          <rect x="21" y="10" width="2" height="4" rx="1" fill="currentColor" stroke="none"/>
          <rect x="4" y="9" width="10" height="6" rx="1" fill="currentColor" stroke="none" opacity="0.9"/>
        </svg>
        <span class="mono" style="font-size:12px;">82%</span>
      </div>

      <div style="width:1px;height:16px;background:var(--border-strong);"></div>

      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);">
        <path d="M12 2v9"/>
        <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
      </svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
