<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg-0: oklch(0.13 0.004 258);
      --surface: oklch(0.24 0.006 258 / 0.8);
      --border-strong: oklch(1 0 0 / 0.18);
      --text: oklch(0.97 0.002 258);
      --text-dim: oklch(0.7 0.005 258);
      --white: oklch(0.98 0 0);
      --track: oklch(1 0 0 / 0.12);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  </style>
</helmet>
<div style="width:560px;height:200px;position:relative;overflow:hidden;background:var(--bg-0);color:var(--text);">

  <div style="position:absolute;inset:0;background:oklch(0 0 0);"></div>

  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:340px;height:64px;border-radius:20px;background:var(--surface);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);border:1px solid var(--border-strong);display:flex;align-items:center;gap:16px;padding:0 22px;">

    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text);flex-shrink:0;">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path d="M17 8a6 6 0 0 1 0 8"/>
      <path d="M19.5 5.5a10 10 0 0 1 0 13"/>
    </svg>

    <div style="flex:1;height:5px;border-radius:3px;background:var(--track);position:relative;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:65%;border-radius:3px;background:var(--white);"></div>
    </div>

    <span class="mono" style="font-size:13px;color:var(--text-dim);width:32px;text-align:right;">65%</span>
  </div>

</div>
</x-dc>
</body>
</html>
