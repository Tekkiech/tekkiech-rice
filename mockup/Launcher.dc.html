<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg-0: oklch(0.13 0.004 258);
      --surface: oklch(0.24 0.006 258 / 0.78);
      --surface-2: oklch(0.99 0 0 / 0.06);
      --border: oklch(1 0 0 / 0.1);
      --border-strong: oklch(1 0 0 / 0.18);
      --text: oklch(0.97 0.002 258);
      --text-dim: oklch(0.7 0.005 258);
      --text-faint: oklch(0.48 0.005 258);
      --white: oklch(0.98 0 0);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
    a{color:var(--text);} a:hover{color:var(--text-dim);}
    .row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;}
  </style>
</helmet>
<div style="width:1600px;height:1000px;position:relative;overflow:hidden;background:var(--bg-0);color:var(--text);">

  <div style="position:absolute;inset:0;background:oklch(0 0 0);"></div>

  <div style="position:absolute;top:0;left:0;right:0;height:44px;background:var(--surface);backdrop-filter:blur(26px);border-bottom:1px solid var(--border);opacity:0.55;z-index:2;"></div>

  <div style="position:absolute;inset:0;background:oklch(0.08 0.003 258 / 0.45);z-index:3;"></div>

  <div style="position:absolute;left:50%;top:150px;transform:translateX(-50%);width:600px;border-radius:20px;background:var(--surface);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--border-strong);z-index:4;overflow:hidden;">

    <div style="display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint);flex-shrink:0;">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.2" y2="16.2"/>
      </svg>
      <div class="mono" style="font-size:15px;color:var(--text-faint);flex:1;">Search apps, files, commands&hellip;</div>
      <div class="mono" style="font-size:11px;color:var(--text-faint);border:1px solid var(--border-strong);border-radius:6px;padding:3px 7px;">esc</div>
    </div>

    <div style="padding:10px;display:flex;flex-direction:column;gap:2px;">

      <div class="row" style="background:var(--surface-2);">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text);flex-shrink:0;">
          <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
          <path d="M6.5 9.5l3.5 2.5-3.5 2.5"/>
          <line x1="12" y1="14.5" x2="16.5" y2="14.5"/>
        </svg>
        <div style="flex:1;font-size:14px;font-weight:500;">Terminal</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">super &crarr;</div>
      </div>

      <div class="row">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);flex-shrink:0;">
          <path d="M8 6L2.5 12 8 18"/>
          <path d="M16 6l5.5 6-5.5 6"/>
        </svg>
        <div style="flex:1;font-size:14px;color:var(--text-dim);">Code &mdash; dotfiles</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">app</div>
      </div>

      <div class="row">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);flex-shrink:0;">
          <circle cx="12" cy="12" r="9"/>
          <ellipse cx="12" cy="12" rx="4" ry="9"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
        </svg>
        <div style="flex:1;font-size:14px;color:var(--text-dim);">Browser</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">app</div>
      </div>

      <div class="row">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);flex-shrink:0;">
          <path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11z"/>
        </svg>
        <div style="flex:1;font-size:14px;color:var(--text-dim);">Files</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">app</div>
      </div>

      <div class="row">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);flex-shrink:0;">
          <path d="M9 18V5l11-2v13"/>
          <circle cx="6.5" cy="18" r="2.5"/>
          <circle cx="17.5" cy="16" r="2.5"/>
        </svg>
        <div style="flex:1;font-size:14px;color:var(--text-dim);">Music</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">app</div>
      </div>

      <div class="row">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--text-dim);flex-shrink:0;">
          <circle cx="12" cy="12" r="8.5" stroke-dasharray="2.2 3.1"/>
          <circle cx="12" cy="12" r="3.4"/>
        </svg>
        <div style="flex:1;font-size:14px;color:var(--text-dim);">Settings</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">app</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
