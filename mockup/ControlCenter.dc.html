<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg-0: oklch(0.13 0.004 258);
      --surface: oklch(0.24 0.006 258 / 0.78);
      --surface-2: oklch(0.99 0 0 / 0.055);
      --border: oklch(1 0 0 / 0.1);
      --border-strong: oklch(1 0 0 / 0.18);
      --text: oklch(0.97 0.002 258);
      --text-dim: oklch(0.7 0.005 258);
      --text-faint: oklch(0.48 0.005 258);
      --white: oklch(0.98 0 0);
      --track: oklch(1 0 0 / 0.12);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
    a{color:var(--text);} a:hover{color:var(--text-dim);}
    .toggle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 0;}
    .toggle.on{background:var(--white);color:oklch(0.15 0 0);}
    .toggle.off{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
    .pbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);color:var(--text-dim);}
  </style>
</helmet>
<div style="width:1600px;height:1000px;position:relative;overflow:hidden;background:var(--bg-0);color:var(--text);">

  <div style="position:absolute;inset:0;background:oklch(0 0 0);"></div>

  <div style="position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--surface);backdrop-filter:blur(26px);border-bottom:1px solid var(--border);z-index:2;">
    <div class="mono" style="font-size:13px;color:var(--text-dim);">~/dotfiles &mdash; nvim</div>
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span class="mono" style="font-size:14px;font-weight:600;">14:32</span>
      <span class="mono" style="font-size:12px;color:var(--text-faint);">Sat, Aug 30</span>
    </div>
  </div>

  <div style="position:absolute;right:22px;top:60px;width:400px;border-radius:20px;background:var(--surface);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--border-strong);z-index:4;padding:22px;display:flex;flex-direction:column;gap:22px;">

    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;" class="mono">I</div>
      <div>
        <div style="font-size:14px;font-weight:500;">isaac</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);">uptime 3h 12m</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;">
      <div class="toggle on">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5a16 16 0 0 1 18 0"/>
          <path d="M6.2 12.2a11 11 0 0 1 11.6 0"/>
          <path d="M9.5 15.8a6 6 0 0 1 5 0"/>
          <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="mono" style="font-size:10.5px;">Wi-Fi</span>
      </div>
      <div class="toggle off">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 7l10 10-5 5V2l5 5L7 17"/>
        </svg>
        <span class="mono" style="font-size:10.5px;">Bluetooth</span>
      </div>
      <div class="toggle off">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none">
          <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5z"/>
        </svg>
        <span class="mono" style="font-size:10.5px;">Focus</span>
      </div>
      <div class="toggle off">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 3L3 10.5l7 2.5 2.5 7L21 3z"/>
        </svg>
        <span class="mono" style="font-size:10.5px;">Airplane</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);flex-shrink:0;">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M17 8a6 6 0 0 1 0 8"/>
        </svg>
        <div style="flex:1;height:5px;border-radius:3px;background:var(--track);position:relative;">
          <div style="position:absolute;left:0;top:0;bottom:0;width:65%;border-radius:3px;background:var(--white);"></div>
          <div style="position:absolute;left:65%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--white);box-shadow:0 1px 4px oklch(0 0 0 / 0.4);"></div>
        </div>
        <span class="mono" style="font-size:11px;color:var(--text-faint);width:28px;text-align:right;">65%</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);flex-shrink:0;">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="4.5"/>
          <line x1="12" y1="19.5" x2="12" y2="22"/>
          <line x1="4.2" y1="4.2" x2="6" y2="6"/>
          <line x1="18" y1="18" x2="19.8" y2="19.8"/>
          <line x1="2" y1="12" x2="4.5" y2="12"/>
          <line x1="19.5" y1="12" x2="22" y2="12"/>
        </svg>
        <div style="flex:1;height:5px;border-radius:3px;background:var(--track);position:relative;">
          <div style="position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:3px;background:var(--white);"></div>
          <div style="position:absolute;left:40%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--white);box-shadow:0 1px 4px oklch(0 0 0 / 0.4);"></div>
        </div>
        <span class="mono" style="font-size:11px;color:var(--text-faint);width:28px;text-align:right;">40%</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--track);flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);">
          <path d="M9 18V5l11-2v13"/>
          <circle cx="6.5" cy="18" r="2.5"/>
          <circle cx="17.5" cy="16" r="2.5"/>
        </svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Field Notes</div>
        <div class="mono" style="font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Ambient Suite</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;color:var(--text-dim);">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M20 4L9 12l11 8V4z"/><rect x="4" y="4" width="3" height="16" rx="1"/></svg>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none"><rect x="5" y="4" width="4.5" height="16" rx="1"/><rect x="14.5" y="4" width="4.5" height="16" rx="1"/></svg>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M4 4l11 8-11 8V4z"/><rect x="17" y="4" width="3" height="16" rx="1"/></svg>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;padding-top:4px;">
      <div class="pbtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <div class="pbtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none">
          <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5z"/>
        </svg>
      </div>
      <div class="pbtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 12a8.5 8.5 0 1 1 2.8 6.3"/>
          <path d="M3.5 17v-5h5"/>
        </svg>
      </div>
      <div class="pbtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v9"/>
          <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
        </svg>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
