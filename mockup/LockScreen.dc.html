<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg-0: oklch(0.13 0.004 258);
      --surface: oklch(0.24 0.006 258 / 0.7);
      --surface-2: oklch(0.99 0 0 / 0.06);
      --border: oklch(1 0 0 / 0.1);
      --border-strong: oklch(1 0 0 / 0.2);
      --text: oklch(0.97 0.002 258);
      --text-dim: oklch(0.7 0.005 258);
      --text-faint: oklch(0.48 0.005 258);
      --white: oklch(0.98 0 0);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  </style>
</helmet>
<div style="width:1600px;height:1000px;position:relative;overflow:hidden;background:var(--bg-0);color:var(--text);">

  <div style="position:absolute;inset:0;background:oklch(0 0 0);"></div>

  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);display:flex;flex-direction:column;align-items:center;gap:26px;z-index:2;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div class="mono" style="font-size:128px;font-weight:500;line-height:1;letter-spacing:-0.01em;">14:32</div>
      <div class="mono" style="font-size:19px;color:var(--text-dim);">Saturday, August 30</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;" class="mono">I</div>
      <div style="font-size:15px;font-weight:500;color:var(--text-dim);">isaac</div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;width:300px;height:52px;border-radius:16px;background:var(--surface);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--border-strong);padding:0 8px 0 22px;">
      <div style="flex:1;display:flex;gap:7px;align-items:center;">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--text);"></div>
        <div style="width:7px;height:7px;border-radius:50%;background:var(--text);"></div>
        <div style="width:7px;height:7px;border-radius:50%;background:var(--text);"></div>
        <div style="width:7px;height:7px;border-radius:50%;background:var(--text);"></div>
        <div style="width:7px;height:7px;border-radius:50%;background:var(--text);"></div>
      </div>
      <div style="width:36px;height:36px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="oklch(0.15 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </div>
    </div>

    <div class="mono" style="font-size:12px;color:var(--text-faint);margin-top:2px;">press enter to unlock</div>
  </div>

  <div style="position:absolute;bottom:26px;left:32px;display:flex;align-items:center;gap:8px;color:var(--text-faint);z-index:2;">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8.5a16 16 0 0 1 18 0"/>
      <path d="M6.2 12.2a11 11 0 0 1 11.6 0"/>
      <path d="M9.5 15.8a6 6 0 0 1 5 0"/>
      <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>
    </svg>
    <span class="mono" style="font-size:11px;">Home</span>
  </div>

  <div style="position:absolute;bottom:26px;right:32px;display:flex;align-items:center;gap:8px;color:var(--text-faint);z-index:2;">
    <span class="mono" style="font-size:11px;">82%</span>
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="2" y="7" width="18" height="10" rx="2.5"/>
      <rect x="21" y="10" width="2" height="4" rx="1" fill="currentColor" stroke="none"/>
      <rect x="4" y="9" width="10" height="6" rx="1" fill="currentColor" stroke="none" opacity="0.9"/>
    </svg>
  </div>

</div>
</x-dc>
</body>
</html>
