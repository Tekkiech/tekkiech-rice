<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg-0: oklch(0.13 0.004 258);
      --surface: oklch(0.24 0.006 258 / 0.8);
      --border: oklch(1 0 0 / 0.1);
      --border-strong: oklch(1 0 0 / 0.18);
      --text: oklch(0.97 0.002 258);
      --text-dim: oklch(0.7 0.005 258);
      --text-faint: oklch(0.48 0.005 258);
      --white: oklch(0.98 0 0);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
    .toast{border-radius:16px;background:var(--surface);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);border:1px solid var(--border-strong);padding:14px;display:flex;gap:12px;}
    .icn{width:36px;height:36px;border-radius:10px;background:oklch(1 0 0 / 0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);}
  </style>
</helmet>
<div style="width:480px;height:760px;position:relative;overflow:hidden;background:var(--bg-0);color:var(--text);">

  <div style="position:absolute;inset:0;background:oklch(0 0 0);"></div>

  <div style="position:absolute;top:26px;right:20px;left:20px;display:flex;flex-direction:column;gap:12px;z-index:2;">

    <div class="toast">
      <div class="icn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5.5" width="18" height="15" rx="2"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="8" y1="3" x2="8" y2="7.5"/>
          <line x1="16" y1="3" x2="16" y2="7.5"/>
        </svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div style="font-size:13px;font-weight:600;">Calendar</div>
          <span class="mono" style="font-size:10.5px;color:var(--text-faint);flex-shrink:0;">now</span>
        </div>
        <div style="font-size:12.5px;color:var(--text-dim);margin-top:3px;">Standup in 10 minutes &mdash; Room 4B</div>
      </div>
    </div>

    <div class="toast">
      <div class="icn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M4 19h16"/>
        </svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div style="font-size:13px;font-weight:600;">Downloads</div>
          <span class="mono" style="font-size:10.5px;color:var(--text-faint);flex-shrink:0;">2m</span>
        </div>
        <div class="mono" style="font-size:12px;color:var(--text-dim);margin-top:3px;">dotfiles-1.4.2.tar.zst &mdash; 42.1 MB</div>
      </div>
    </div>

    <div class="toast">
      <div class="icn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="7" width="18" height="10" rx="2.5"/>
          <rect x="21" y="10" width="2" height="4" rx="1" fill="currentColor" stroke="none"/>
          <line x1="8" y1="9.5" x2="8" y2="12.5" stroke-linecap="round"/>
          <circle cx="8" cy="14.5" r="0.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div style="font-size:13px;font-weight:600;">Battery low</div>
          <span class="mono" style="font-size:10.5px;color:var(--text-faint);flex-shrink:0;">5m</span>
        </div>
        <div style="font-size:12.5px;color:var(--text-dim);margin-top:3px;">18% remaining &mdash; connect charger</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
