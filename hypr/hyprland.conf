# tekkiech-rice — hyprland.conf
# Installed by install.sh to ~/.config/hypr/hyprland.conf
# Hyprland config reference: https://wiki.hyprland.org/Configuring/

monitor = , preferred, auto, 1

# Shell
exec-once = qs -c tekkiech

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(ffffff33)
    col.inactive_border = rgba(00000000)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8

    # This is what actually blurs what's behind the Quickshell bar/launcher/
    # etc. panels (they're layer-shell surfaces) — without it the "glass"
    # panels in the mockup just render as flat translucent rectangles.
    blur {
        enabled = true
        size = 10
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, easeOut, popin 90%
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

$mainMod = SUPER
$terminal = foot

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, R, exec, qs -c tekkiech ipc call launcher toggle

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
