# tekkiech-rice — fuzzel config, matches /mockup's Launcher.dc.html
# Installed to ~/.config/fuzzel/fuzzel.ini
#
# Switched from rofi-wayland to fuzzel after finding live on a real
# Arch Linux ARM VM that rofi-wayland doesn't exist there at all —
# ARM's `rofi` is 1.7.5, which predates rofi's own Wayland merge
# (first mainline Wayland release was 2.0.0), so it's X11-only there.
# fuzzel is natively Wayland (wlroots layer-shell) on every
# architecture, in the official repos on all of them, and uses the
# same fcft font-rendering library as foot — one less moving part
# instead of an x86-vs-ARM package-name branch in install.sh.

[main]
font=Rubik:size=12
dpi-aware=no
icon-theme=Papirus-Dark
terminal=foot
width=42
lines=8
line-height=24
inner-pad=14
horizontal-pad=20
vertical-pad=14
layer=overlay

[colors]
background=18181aee
text=b3b3b8ff
match=f7f7f8ff
selection=ffffff14
selection-text=f7f7f8ff
selection-match=f7f7f8ff
border=3a3a3cff
prompt=7a7a80ff
placeholder=7a7a80ff

[border]
width=1
radius=20
